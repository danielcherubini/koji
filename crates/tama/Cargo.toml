[package]
name = "tama"
version = "2.1.0"
edition.workspace = true
license.workspace = true
description = "A local AI server with automatic backend management"

[[bin]]
name = "tama"
path = "src/main.rs"
required-features = ["ssr"]

[lib]
name = "tama_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true, features = ["csr"] }
leptos_router.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3"
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "EventSource", "EventSourceInit", "MessageEvent", "Event", "KeyboardEvent", "MouseEvent", "SvgElement", "SvgsvgElement", "DomRect", "Storage", "console", "Navigator", "Clipboard"] }
gloo-net.workspace = true
log.workspace = true
gloo-timers.workspace = true
wasm-bindgen-futures.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url = "2.5"

# Backend-only deps (not needed for WASM, gated behind the `ssr` feature)
axum = { workspace = true, optional = true }

tower-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
async-stream = { version = "0.3", optional = true }
tama-core = { path = "../tama-core", optional = true }
sqlx = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
time = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4", "js"] }
urlencoding = "2.1"
chrono = "0.4.44"
tempfile.workspace = true

[features]
default = ["ssr"]
csr = []
ssr = [
  "dep:axum", "dep:tokio", "dep:async-stream", "dep:anyhow", "dep:include_dir",
  "dep:reqwest", "dep:mime_guess", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender",
  "dep:tama-core", "dep:sqlx", "dep:toml", "dep:tower-http", "dep:thiserror",
  "dep:regex",
  "dep:clap",
  "dep:toml_edit",
  "dep:percent-encoding",
  "dep:time",
  "dep:rusqlite",
  "tama-core/web-ui",
]

[[test]]
name = "tamad_installs_e2e"
path = "tests/tamad_installs_e2e.rs"
required-features = ["ssr"]

[[test]]
name = "reconciler_e2e"
path = "tests/reconciler_e2e.rs"
required-features = ["ssr"]

[[test]]
name = "tamad_bench_e2e"
path = "tests/tamad_bench_e2e.rs"
required-features = ["ssr"]

[[test]]
name = "server_test"
path = "tests/server_test.rs"
required-features = ["ssr"]

[[test]]
name = "backup_restore"
path = "tests/backup_restore.rs"
required-features = ["ssr"]

[[test]]
name = "config_structured_test"
path = "tests/config_structured_test.rs"
required-features = ["ssr"]

[[test]]
name = "pulls_api"
path = "tests/pulls_api.rs"
required-features = ["ssr"]

[[test]]
name = "router_ownership_test"
path = "tests/router_ownership_test.rs"
required-features = ["ssr"]

[[test]]
name = "migrate"
path = "tests/migrate.rs"
required-features = ["ssr"]

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tama-test-support.workspace = true
wiremock = "0.6"
# Test stubs for the tamad gRPC side (exercises the proxy-side bridge).
tama-core = { path = "../tama-core", features = ["test-stubs"] }
# Full-stack install/update/remove E2E builds marker release archives.
tar = "0.4"
flate2 = "1.0"


[package.metadata.deb]
maintainer = "Daniel Cherubini <daniel@cherubini.casa>"
section = "utils"
priority = "optional"
assets = [
    ["target/release/tama", "usr/bin/", "755"],
]
extended-description = "Tama is a local AI service manager that wraps llama.cpp and similar backends into supervised system services with health checks, auto-restart, and easy configuration."

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tama", dest = "/usr/bin/tama", mode = "755" },
]
