[project]
name = "tama-compaction-server"
version = "0.1.0"
description = "LLMLingua-2 prompt compaction server for Tama"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "llmlingua>=0.3.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
]

[project.scripts]
tama-compaction = "main:main"
