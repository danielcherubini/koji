[package]
name = "tama-core"
version = "2.1.0"
edition.workspace = true
build = "build.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
directories.workspace = true
sysinfo.workspace = true
shlex = { workspace = true }
reqwest.workspace = true
hf-hub.workspace = true
futures-util.workspace = true
url.workspace = true
flate2 = "1.0"
tar = "0.4"
tempfile.workspace = true
axum.workspace = true
axum-server.workspace = true
tower-http.workspace = true
bytes.workspace = true
serde_json.workspace = true
async-stream = "0.3"
langfuse-ergonomic = "0.6.3"
uuid = { version = "1", features = ["v4"] }
self_update = { version = "0.44", default-features = false, features = ["archive-tar", "compression-flate2", "rustls", "ureq"] }
http = "1"
semver = "1"
sha2 = "0.10"
chrono = { workspace = true }
lru = "0.12"
futures = "0.3"
regex.workspace = true
rand.workspace = true
strum = { version = "0.27", features = ["derive"] }
include_dir.workspace = true
gguf-parser = { git = "https://github.com/Defilan/gguf-parser", branch = "main" }
oauth2.workspace = true
cookie.workspace = true
percent-encoding = "2"
# tokio-util: CancellationToken for the log-store writer's shutdown seam
# (the same role the tracing_appender WorkerGuard plays for the JSON file
# writer; see logstore/writer.rs) — thin over tokio 1.x, already transitively
# configured in the workspace graph.
tokio-util = "0.7"
tonic.workspace = true
prost.workspace = true
sqlx.workspace = true
rusqlite.workspace = true

[features]
web-ui = []
test-stubs = []

[lints.clippy]
# The tamad RPC wire (prost/tonic codegen via build.rs → OUT_DIR/tamad.rs)
# has wrapper fns whose Err ~200B can overflow clippy's result_large_err.
# Overflow count is probe-sensitive: same pinned 1.95.0 yields 1 fn locally,
# 8+ on CI (ubuntu) — prost codegen `size_of` drifts per environment.
# Pin ALLOW in the manifest: generated files aren't touchable by gen-stamp
# edits or per-file attrs, and CI env can't carry this. Shape is pinned in
# tests/tamad_lint_wing_pin.rs (denial is linted here, not flagged later).
result_large_err = "allow"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
# dev-only: `start_paused` (`tokio::time` Mock clock) for the logstore writer tests
tokio = { workspace = true, features = ["test-util"] }
serde_json = "1.0.149"
tempfile.workspace = true
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
tama-test-support.workspace = true
