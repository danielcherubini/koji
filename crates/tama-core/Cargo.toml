shlex = { workspace = true }
reqwest.workspace = true
hf-hub.workspace = true
futures-util.workspace = true
inquire.workspace = true
url.workspace = true
zip = "6.0"
flate2 = "1.0"
tar = "0.4"
tempfile.workspace = true
axum.workspace = true
axum-server.workspace = true
