name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (mold linker)
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys:
            ${{ runner.os }}-cargo-release-

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build Leptos WASM frontend
        working-directory: crates/tama
        run: trunk build --release --no-default-features --features csr

      - name: Build release
        run: cargo build --release

      - name: Create self-update archive (Linux)
        run: |
          cd target/release
          tar czf tama-x86_64-unknown-linux-gnu.tar.gz tama

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build .deb package
        run: cargo deb -p tama

      - name: Build .rpm package
        run: |
          strip -s target/release/tama
          cargo generate-rpm -p crates/tama

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            target/release/tama
            target/release/tama-x86_64-unknown-linux-gnu.tar.gz
            target/debian/*.deb
            target/generate-rpm/*.rpm

  release:
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: linux

      - name: Generate release notes
        run: |
          gh release create ${{ needs.version.outputs.version }} \
            --title "Tama ${{ needs.version.outputs.version }}" \
            --generate-notes \
            linux/**/tama \
            linux/**/tama-x86_64-unknown-linux-gnu.tar.gz \
            linux/**/*.deb \
            linux/**/*.rpm
        env:
          GH_TOKEN: ${{ github.token }}
