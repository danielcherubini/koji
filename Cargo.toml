[workspace]
members = [
    "crates/tama-core",
    "crates/tama-mock",
    "crates/tama",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
directories = "5"
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["stream", "native-tls", "json"] }
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "native-tls"] }
futures-core = "0.3"
futures-util = "0.3"
indicatif = "0.18"
tempfile = "3"
url = "2"
axum = { version = "0.7", features = ["http2", "macros", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.5", features = ["cors", "trace", "catch-panic"] }
bytes = "1.0"
rusqlite = { version = "0.34", features = ["bundled"] }
leptos = { version = "0.7", default-features = false }
leptos_router = { version = "0.7" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", default-features = false }
include_dir = "0.7"
mime_guess = "2"
gloo-net = { version = "0.6", features = ["http", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
nix = { version = "0.29", features = ["process"] }
regex = "1"
log = "0.4"
rand = "0.9"
oauth2 = { version = "5", features = ["reqwest"] }
cookie = { version = "0.18", features = ["secure", "percent-encode", "signed"] }

# Build performance: line-tables-only for workspace crates (backtraces work),
# no debug info for dependencies. Use --profile debugging for full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
